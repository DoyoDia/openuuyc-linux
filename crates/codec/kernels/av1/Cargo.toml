[package]
name = "openuuyc-av1"
version = "0.1.0"
edition = "2021"
publish = false
description = "OpenUUYC AV1 bitstream syntax and SIMD software decoding"
license-file = "../../../../LICENSE"
build = "build.rs"

[dependencies]
log = "0.4.34"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
cfg-if = "1.0.5"
libc = "0.2.191"
assert_matches = "1.5.0"
atomig = { version = "0.4.3", features = ["derive"] }
av-data = "0.4.4"
bitflags = "2.13.2"
parking_lot = "0.13.0"
paste = "1.0.15"
raw-cpuid = "11.6.0"
static_assertions = "1.1.0"
strum = { version = "0.28.0", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.8.63", features = ["derive"] }

[build-dependencies]
cc = { version = "1.10.0", features = ["parallel"], optional = true }
nasm-rs = { version = "0.3.2", features = ["parallel"], optional = true }

[features]
default = ["asm", "bitdepth_8", "bitdepth_16"]
asm = ["dep:cc", "dep:nasm-rs"]
bitdepth_8 = []
bitdepth_16 = []

[dev-dependencies]
pretty_assertions = "1.4.1"

