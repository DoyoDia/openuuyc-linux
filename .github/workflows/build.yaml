name: Release for Linux

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dpkg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/ { s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p; }' Cargo.toml)
          test -n "$version"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang nasm pkg-config dpkg-dev libva-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libvulkan-dev libudev-dev libssl-dev

      - name: Get Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-deb
        uses: taiki-e/install-action@main
        with:
          tool: cargo-deb

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --bin openuuyc
          cd crates/vkms && CARGO_TARGET_DIR=../../target cargo build --release --locked

      - name: Check the developer probes still build
        shell: bash
        run: |
          cargo check --locked --bins \
            --manifest-path devtools/probes/gpu-conversion/Cargo.toml \
            --target-dir target/probes
          gcc -fsyntax-only -Wall devtools/probes/vaapi_export_probe.c
          gcc -fsyntax-only -Wall devtools/probes/vulkan_dmabuf_probe.c

      - name: Package to deb
        shell: bash
        run: cargo deb --no-build

      - name: Collect release binaries and deb package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -Dm755 target/release/openuuyc dist/openuuyc
          install -Dm755 target/release/openuuyc-vkms dist/openuuyc-vkms
          cp target/debian/*.deb dist/

      - name: Upload the deb package and binaries
        uses: actions/upload-artifact@main
        with:
          name: release_dpkg
          path: dist/*
          if-no-files-found: error

  pacman:
    needs: dpkg
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      RELEASE_TAG: ${{ needs.dpkg.outputs.tag }}
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
            archlinux-keyring base-devel git zstd

      - name: Checkout packaging files
        uses: actions/checkout@main

      - name: Download the deb package and binaries
        uses: actions/download-artifact@main
        with:
          name: release_dpkg
          path: dist

      - name: Assemble the release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          stage="openuuyc-${version}-x86_64-linux"
          mkdir -p "$stage"
          # Artifact downloads do not preserve executable permissions.
          chmod +x dist/openuuyc dist/openuuyc-vkms
          # Keep the package/ layout in the release archive.
          install -Dm755 dist/openuuyc "$stage/openuuyc"
          install -Dm755 dist/openuuyc-vkms "$stage/openuuyc-vkms"
          install -Dm755 package/omarchy/install-omarchy.sh "$stage/package/omarchy/install-omarchy.sh"
          for file in package/linux/openuuyc.desktop \
            package/linux/60-openuuyc-uinput.rules \
            package/linux/app-openuuyc.service \
            package/linux/openuuyc.service \
            package/linux/openuuyc-vkms.socket \
            package/linux/openuuyc-vkms.service \
            package/omarchy/omarchy-menu.jsonc assets/icon-256.png \
            LICENSE NOTICES.md; do
            install -Dm644 "$file" "$stage/$file"
          done
          tar --zstd -cf "dist/$stage.tar.zst" "$stage"
          ls -lh "dist/$stage.tar.zst" dist/openuuyc dist/openuuyc-vkms

      - name: Build the pacman package from the local archive
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          stage="openuuyc-${version}-x86_64-linux"
          mkdir -p /tmp/pacman-package
          cp package/arch/{PKGBUILD,openuuyc.install} /tmp/pacman-package/
          # Reuse the package layout, but package this run's prebuilt archive.
          sed -i 's|target/release/||g; s|cd "$pkgname"|cd "$_dir"|g' /tmp/pacman-package/PKGBUILD
          cp "dist/$stage.tar.zst" /tmp/pacman-package/
          # Override the release download: package the binaries built by this run.
          # Keep Cargo's SemVer unchanged; split the version only for Arch.
          # 1.0.2-beta.6 -> pkgver=1.0.2, pkgrel=6; stable releases default to 1.
          pkgver=$(printf '%s\n' "$version" | sed -nE 's/^([0-9]+\.[0-9]+\.[0-9]+)(-[[:alpha:]]+\.[0-9]+)?$/\1/p')
          pkgrel=$(printf '%s\n' "$version" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-[[:alpha:]]+\.([0-9]+)$/\1/p')
          pkgrel="${pkgrel:-1}"
          if [[ -z "$pkgver" || ! "$pkgrel" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Cannot derive Arch package version from release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'Release tag: %s; Arch pkgver: %s; pkgrel: %s\n' "$RELEASE_TAG" "$pkgver" "$pkgrel"
          sed -i \
            -e "s|@PKGVER@|$pkgver|g" \
            -e "s|@PKGREL@|$pkgrel|g" \
            /tmp/pacman-package/PKGBUILD
          printf '\n_dir=%q\nsource=(%q)\nsha256sums=(SKIP)\nprepare() { :; }\nbuild() { :; }\n' \
            "$stage" "$stage.tar.zst" \
            >> /tmp/pacman-package/PKGBUILD
          useradd --create-home builder
          chown -R builder:builder /tmp/pacman-package
          runuser -u builder -- bash -c 'cd /tmp/pacman-package && makepkg --nodeps --noconfirm'
          mkdir -p dist
          cp /tmp/pacman-package/*.pkg.tar.zst dist/
          pacman -Qip dist/*.pkg.tar.zst

      - name: Upload the pacman package and release archive
        uses: actions/upload-artifact@main
        with:
          name: release_pacman
          path: |
            dist/*.pkg.tar.zst
            dist/openuuyc-*-x86_64-linux.tar.zst
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ needs.dpkg.outputs.tag }}
          files: |
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/openuuyc-*-x86_64-linux.tar.zst
            dist/openuuyc
            dist/openuuyc-vkms
          body: |
            ## Release ${{ needs.dpkg.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
