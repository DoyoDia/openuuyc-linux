name: Build test on PR happens

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang nasm pkg-config dpkg-dev libva-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libvulkan-dev libudev-dev libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master

      - name: Build openuuyc
        shell: bash
        run: cargo build --release --locked --bin openuuyc

      - name: Build VKMS helper
        working-directory: crates/vkms
        shell: bash
        run: CARGO_TARGET_DIR=../../target cargo build --release --locked
