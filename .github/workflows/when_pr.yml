name: Linux auto release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: linux-auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag a version that has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -n "$version"
          if [ -n "$(git tag -l "v${version}-linux.*")" ]; then
            echo "v${version} already has a Linux release; nothing to do"
            exit 0
          fi
          tag="v${version}-linux.1"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run build-dpkg.yml --ref "$tag"
          gh workflow run build-pacman.yml --ref "$tag"
          echo "tagged $GITHUB_SHA as $tag and started the release builds"
